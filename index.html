<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如何快速成為一個優秀的交易者？ · Anson筆記</title>
  <meta name="description" content="從 280 個歷史大升股案例，建立你的視覺記憶">
  <meta name="theme-color" content="#111214">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("anson-notes-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://kindlyanson.com/" aria-label="Anson筆記">
      <div class="brand-text">
        <div class="brand-name">Anson筆記</div>
      </div>
    </a>
    <div class="top-actions">
      <button class="btn" id="themeToggle" type="button">淺色</button>
    </div>
  </header>

  <main>
    <article class="essay">
      <a class="back-link" href="https://kindlyanson.com/">免費教學</a>
      <img class="cover-avatar" src="https://kindlyanson.com/html/shared/kindlyanson-avatar.jpg" width="96" height="96" alt="KindlyAnson">
      <h1>如何快速成為一個優秀的交易者？</h1>
      <p class="dek">從 280 個歷史大升股案例，建立你的視覺記憶</p>

      <div class="essay-body">
        <section>
          <p>如果將交易學習變成一個培訓項目：收集 500 個歷史案例，逐張研究、反覆翻閱，你會看見甚麼？</p>
          <p>我先整理了 280 個案例，全部圍繞同一個主題：一年內升超過 300% 的股票。</p>
          <p>不是叫你追逐已經大升的股票，而是將圖表拉回起漲之前，看看它們當時是甚麼樣子。</p>
        </section>
        <section>
          <p>突破之前，整理了多久？波幅有沒有逐步收窄？成交量如何變化？第一段升勢之後，回調是有秩序，還是迅速破壞了原本的結構？</p>
          <p>這個練習的核心，是視覺記憶。</p>
        </section>
        <figure class="chart-figure">
          <div id="app" class="chart-card">
            <div class="toolbar">
              <div class="row">
                <label class="field">年份
                  <select id="year-filter" aria-label="年份"></select>
                </label>
                <label class="field">案例
                  <select id="case-select" aria-label="案例"></select>
                </label>
                <button type="button" id="prev-btn">上一題</button>
                <button type="button" id="next-btn">下一題</button>
                <span id="counter" class="counter">0 / 0</span>
                <span class="tools">
                  <button type="button" id="measure-btn" title="拖拉兩點測量漲跌幅；亦可按住 Shift 拖拉">測量</button>
                  <button type="button" id="text-btn" title="在圖上點一下寫短註記">文字</button>
                </span>
              </div>
              <div class="row">
                <div class="legend">
                  <span><i class="swatch ema10"></i>EMA 10 <em class="val" id="val-ema10">—</em></span>
                  <span><i class="swatch ema20"></i>EMA 20 <em class="val" id="val-ema20">—</em></span>
                  <span><i class="swatch sma50"></i>SMA 50 <em class="val" id="val-sma50">—</em></span>
                  <span><i class="swatch sma200"></i>SMA 200 <em class="val" id="val-sma200">—</em></span>
                  <span><i class="swatch vol"></i>成交量</span>
                  <span id="ohlc" class="ohlc"></span>
                </div>
              </div>
              <div id="status"></div>
            </div>
            <div id="chart-wrap">
              <div id="chart"></div>
              <div id="note-editor">
                <input id="note-input" type="text" maxlength="80" placeholder="輸入文字，Enter 確定，Esc 取消" autocomplete="off">
              </div>
              <div id="boot-error"></div>
            </div>
          </div>
        </figure>
      </div>
    </article>
  </main>

  <footer class="footer">
    <a href="https://kindlyanson.com/">Anson筆記</a>
  </footer>

  <!-- TradingView Lightweight Charts v5.3.0, vendored for offline use.
       If the vendor file is missing, you may instead use:
       https://cdn.jsdelivr.net/npm/lightweight-charts@5.3.0/dist/lightweight-charts.standalone.production.js -->
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/ma.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
