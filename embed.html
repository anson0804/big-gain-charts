<!DOCTYPE html>
<html lang="zh-Hant" class="is-embed" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>視覺記憶圖表</title>
  <meta name="description" content="歷史大升股 K 線。給 kindlyanson.com 嵌入的圖表。">
  <meta name="theme-color" content="#0b0e13">
  <!-- Public chart. This host does not send X-Frame-Options or CSP frame-ancestors, so kindlyanson.com and other sites can iframe this page. Fullscreen is requested on the chart card; the parent iframe needs allow="fullscreen". -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="embed">
  <div id="app" class="chart-card">
    <div class="toolbar">
      <div class="row">
        <label class="field">年份
          <select id="year-filter" aria-label="年份"></select>
        </label>
        <label class="field">案例
          <select id="case-select" aria-label="案例"></select>
        </label>
        <button type="button" id="prev-btn">上一題</button>
        <button type="button" id="next-btn">下一題</button>
        <span id="counter" class="counter">0 / 0</span>
      </div>
      <div class="row draw-tools" role="toolbar" aria-label="畫圖">
        <button type="button" id="measure-btn" title="拖拉兩點測量漲跌幅，完成後留在這個案例；亦可按住 Shift 拖拉">測量</button>
        <button type="button" id="text-btn" title="在圖上點一下寫短註記">文字</button>
        <button type="button" id="trend-btn" title="拖拉，或點兩下，畫趨勢線">趨勢線</button>
        <button type="button" id="hline-btn" title="在一個價位畫水平線">水平線</button>
        <button type="button" id="rect-btn" title="拖拉，或點兩下，畫矩形">矩形</button>
        <button type="button" id="delete-draw-btn" title="刪除選取的畫線或測量" disabled>刪除</button>
        <button type="button" id="fullscreen-btn" title="放大圖表">全螢幕</button>
        <button type="button" id="save-draw-btn" title="把這個案例的畫線與測量存到這個瀏覽器，不會下載檔案">儲存</button>
        <button type="button" id="download-image-btn" title="下載目前圖表的 PNG，包含 K 線、成交量、均線、畫線、測量與文字">下載圖片</button>
      </div>
      <div class="row">
        <div class="legend">
          <span><i class="swatch ema10"></i>EMA 10 <em class="val" id="val-ema10">—</em></span>
          <span><i class="swatch ema20"></i>EMA 20 <em class="val" id="val-ema20">—</em></span>
          <span><i class="swatch sma50"></i>SMA 50 <em class="val" id="val-sma50">—</em></span>
          <span><i class="swatch sma200"></i>SMA 200 <em class="val" id="val-sma200">—</em></span>
          <span><i class="swatch vol"></i>成交量</span>
          <span id="ohlc" class="ohlc"></span>
        </div>
      </div>
      <div id="status"></div>
    </div>
    <div id="chart-wrap">
      <div id="chart"></div>
      <div id="note-editor">
        <input id="note-input" type="text" maxlength="80" placeholder="輸入文字，Enter 確定，Esc 取消" autocomplete="off">
      </div>
      <div id="boot-error"></div>
    </div>
    <aside class="draw-panel" aria-label="已儲存的畫線">
      <div class="draw-panel-head">
        <strong>已儲存的畫線</strong>
        <span id="draw-saved" class="draw-saved"></span>
        <span class="draw-actions">
          <button type="button" id="clear-draw-btn">清除</button>
        </span>
      </div>
      <p id="draw-empty" class="draw-empty">這個案例還沒有畫線或測量。</p>
      <ul id="draw-list" class="draw-list"></ul>
    </aside>
  </div>

  <!-- TradingView Lightweight Charts v5.3.0, vendored for offline use. -->
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/ma.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
